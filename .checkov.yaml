# checkov policy for infra/. Every skip carries its reason; a skip without
# a reason is a review finding.
directory:
  - infra
framework:
  - terraform
compact: true
quiet: true
skip-check:
  # Terraform state bucket: single-region portfolio project; cross-region
  # replication and event notifications are cost without benefit here.
  - CKV_AWS_144   # S3 cross-region replication
  - CKV2_AWS_62   # S3 event notifications
  - CKV_AWS_18    # S3 access logging (needs a second bucket; the state bucket has no public path)
  # Deploy-role IAM exceptions are inline on the policy document in
  # infra/bootstrap/aws/main.tf, each with its reason, so they cannot
  # silently apply to any other policy.
  # Route 53 hardening shipped in M9c (infra/aws/dnssec.tf): DNSSEC signing
  # and query logging, so CKV2_AWS_38/CKV2_AWS_39 no longer need a skip.

  # M2c - the alert spine (infra/aws/{storage,messaging,lambdas,api,console,secrets}.tf).
  # v1 trade-offs; the DYNAMODB/SSM/Lambda-env plaintext ones are the exact
  # accepted trade-off from docs/specs/m2c-spine-terraform-console.md.
  - CKV_AWS_119   # DynamoDB CMK encryption - spec requires "SSE default" (AWS-owned key) to stay free
  - CKV2_AWS_16   # DynamoDB autoscaling - fixed 5/5 provisioned capacity is the free-tier ceiling on purpose
  - CKV_AWS_337   # SSM SecureString CMK - spec requires the AWS-managed KMS default key
  - CKV_AWS_173   # Lambda env var CMK - plaintext secrets in Lambda config are the stated v1 trade-off (see lambdas.tf)
  - CKV_AWS_115   # Lambda reserved concurrency - low, bursty portfolio traffic; no need to cap it
  - CKV_AWS_116   # Lambda function-level DLQ (async destinations) - SQS-level DLQ already catches worker failures
  - CKV_AWS_117   # Lambda in a VPC - every AWS resource here is a public managed endpoint; no VPC in this design
  - CKV_AWS_50    # Lambda X-Ray tracing - added observability cost with no SLO this milestone depends on
  - CKV_AWS_272   # Lambda code signing - needs a signing profile; out of scope for a single-account portfolio project
  - CKV_AWS_158   # CloudWatch Logs KMS CMK - AWS-managed encryption at rest is already on by default
  - CKV_AWS_338   # CloudWatch Logs >= 1 year retention - spec sets 14 days everywhere to cap log storage cost
  - CKV_AWS_309   # API Gateway v2 route authorizer - auth is enforced in the Lambda (bearer token, ADR-0010)
  - CKV_AWS_145   # S3 KMS-by-default - spec requires SSE-S3 (AES256) for the console bucket
  - CKV_AWS_68    # CloudFront WAF - explicit non-requirement in docs/specs/m2c-spine-terraform-console.md
  - CKV2_AWS_47   # CloudFront WAFv2 Log4j managed rule - same WAF non-requirement as CKV_AWS_68
  - CKV_AWS_86    # CloudFront access logging - needs a second bucket; API Gateway already logs every request
  - CKV_AWS_310   # CloudFront origin failover - single S3 origin; no second origin to fail over to
  - CKV_AWS_374   # CloudFront geo restriction - public console with no geographic access policy to enforce

  # M3b - the triage-worker image (infra/aws-ecr/ecr.tf, infra/aws/lambdas.tf).
  - CKV_AWS_136   # ECR KMS encryption - spec requires AES256 (AWS-managed key), same free-tier trade-off as the other stores

  # M5b - the Azure Functions estate (infra/azure/{storage,functions,alerts}.tf).
  # Consumption (Y1) plan + LRS storage are the spec's budget ($2/month);
  # nothing here sits behind a VNet (mirrors the AWS estate's CKV_AWS_117
  # "no VPC in this design" trade-off) - Private Endpoints, zone redundancy
  # and a Premium plan all cost real money this milestone doesn't have.
  # Verified against `checkov --config-file .checkov.yaml` (what ci.yml's
  # checkov-action actually runs) - a bare `checkov --directory infra/azure`
  # invocation does not evaluate these checks at all (graph checks need the
  # full `directory: [infra]` scan the config file gives them), so re-check
  # with the config file, not a narrower ad-hoc command, before touching
  # this list.
  - CKV_AZURE_212 # Service Plan minimum instance count - Y1 Consumption has no fixed instance count; serverless scale is the point
  - CKV_AZURE_225 # Service Plan zone redundancy - Premium-plan-only feature, not available on Y1 Consumption
  - CKV_AZURE_221 # Function App public network access - both apps need a public HTTPS endpoint; no VNet in this design
  - CKV_AZURE_59  # Storage account public access - the Functions control-plane storage is reached over its public endpoint; no VNet in this design
  - CKV_AZURE_33  # Storage Analytics queue logging - Application Insights + Log Analytics already cover this milestone's observability
  - CKV_AZURE_206 # Storage account replication - spec requires LRS (the $2/month budget); GRS/ZRS cost more for a control-plane-only account
  - CKV2_AZURE_33 # Storage account private endpoint - same "no VNet" trade-off as CKV_AZURE_221/CKV_AZURE_59
  - CKV2_AZURE_41 # Storage account SAS expiration policy - no application code issues SAS tokens from this account; Functions runtime plumbing only
  - CKV2_AZURE_38 # Storage account soft-delete - holds only Functions triggers/locks/deployment zips, nothing worth a recovery window
  - CKV2_AZURE_1  # Storage account customer-managed key - a CMK needs Key Vault (~$1/month), out of budget; Microsoft-managed encryption is already on by default
  - CKV2_AZURE_40 # Storage account shared-key authorization - Y1 Consumption Function apps authenticate to their own control-plane storage with an account key; no managed-identity path exists for that connection on this plan (infra/README.md)
