# Values for the upstream `prometheus-community/kube-prometheus-stack`
# chart. Pinned version: 65.5.1 (also pinned in M6b's Taskfile `estate-up`
# task, which runs `helm repo add prometheus-community
# https://prometheus-community.github.io/helm-charts` then
# `helm upgrade --install ... --version 65.5.1 -f deploy/helm/values/kube-prometheus-stack.yaml`).
#
# Grafana is disabled (out of scope for M6, see docs/specs/m6-kind-estate.md
# non-requirements).
#
# Alertmanager routing (M7b, route A by default / route B for Kafka's own
# alerts - see docs/DESIGN.md 4.4): everything defaults to `route-a-kafka`,
# a webhook straight to `alerts-bridge` (produces to Kafka's `alerts.raw`,
# consumed by `kafka-relay`, which HMAC-signs and POSTs to ingest); the four
# alerts *about* Kafka itself - which can't reliably travel over the thing
# they're reporting broken - take a first-match child route to
# `route-b-forwarder`, the pre-M7 `bank/azure/alert_forwarder` webhook.
# `scripts/render_alertmanager_values.py --no-kafka` replaces this whole
# block with the M6 routing (everything to route B, no Kafka in the
# picture) when `kafka.enabled=false`; both are exercised by
# `tests/scripts/test_render_alertmanager_values.py` and rendered by
# `task helm-check` / `ci.yml`'s `helm` job.
#
# Upstream values can't read this repo's own `nordwind-bank` chart values,
# so the forwarder URL below is the placeholder `__FORWARDER_URL__`.
# `scripts/render_alertmanager_values.py` substitutes it for the real
# bank/azure/alert_forwarder function URL before `helm upgrade` (M6b's
# `task estate-up`); with no URL supplied it substitutes a dummy local
# address instead, so this file renders as valid YAML - and `helm lint`
# passes on the `nordwind-bank` chart - even before a forwarder exists.
#
# M6b: Prometheus and Alertmanager are exposed as NodePort Services (30090,
# 30093) so `deploy/kind/cluster.yaml`'s extraPortMappings can forward them
# to localhost:9090/9093 with no `kubectl port-forward`.

grafana:
  enabled: false

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    # __ROUTE_KAFKA_BLOCK_START__
    route:
      receiver: route-a-kafka
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      # Helm deep-merges `config` with the chart's own default config
      # (values.yaml, not this file) rather than replacing it outright:
      # our `receivers` list below fully replaces the default one (Helm
      # only deep-merges maps, not lists), but the default `route.routes`
      # sub-route sending `alertname: Watchdog` to a `null` receiver is a
      # map and survives the merge unless we replace `routes` too - done
      # below, so no stray `null` receiver needs to exist.
      routes:
        - receiver: route-b-forwarder
          matchers:
            - alertname =~ "KafkaBrokerDown|KafkaRelayLag|AlertsBridgeDown|KafkaRelayDown"
          continue: false
    receivers:
      - name: route-a-kafka
        webhook_configs:
          - url: "http://nordwind-bank-alerts-bridge.bank.svc:8080/alertmanager"
            send_resolved: true
      - name: route-b-forwarder
        webhook_configs:
          - url: "__FORWARDER_URL__"
            send_resolved: true
    # __ROUTE_KAFKA_BLOCK_END__
  service:
    type: NodePort
    nodePort: 30093

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    # Rendered per run by scripts/render_alertmanager_values.py: the label
    # travels on every alert, so consecutive demo runs never share an
    # ingest fingerprint (30-minute dedup window) - #71.
    externalLabels:
      cluster: "__CLUSTER_LABEL__"
    # Opens the rule/ServiceMonitor selectors so kube-prometheus-stack
    # picks up nordwind-bank's PrometheusRule and ServiceMonitors
    # regardless of namespace or the `release: monitoring` label - see
    # deploy/helm/nordwind-bank/README.md for why that label is kept too.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
  service:
    type: NodePort
    nodePort: 30090

# kind runs the control plane as static pods without the scrape endpoints
# these upstream groups expect; they only ever fire TargetDown. Keeping the
# node / kubelet / prometheus-operator groups so real cluster trouble still
# shows (routed to `null` unless a bank service label is present).
defaultRules:
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false
    general: false
