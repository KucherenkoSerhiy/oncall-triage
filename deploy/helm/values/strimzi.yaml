# Values for the upstream `strimzi-kafka-operator` chart (helm repo add
# strimzi https://strimzi.io/charts/), installed by `task estate-up` into
# the `kafka` namespace. Version pinned in Taskfile.yml's STRIMZI_VERSION var.
#
# The operator Deployment itself runs in `kafka`; `watchNamespaces`
# restricts which namespace(s) it reconciles Kafka/KafkaNodePool/KafkaTopic/
# KafkaUser custom resources in, so it only manages `bank`'s Kafka cluster
# (`watchAnyNamespace: false` keeps that scoped rather than cluster-wide).
watchNamespaces:
  - bank
watchAnyNamespace: false

# Upstream defaults 384Mi/384Mi - trimmed for kind, matching the rest of the
# kind estate's resource requests/limits (see deploy/kind, kube-prometheus-stack.yaml).
# The cluster operator is a JVM too: on a 4-vCPU GitHub runner it
# crash-looped under a 256Mi limit + 500m CPU cap while the Kafka pods it
# manages were fine (estate-demo run 34434692555, #83). No CPU limit, and
# enough memory for the operator plus its per-cluster reconciliation state.
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 768Mi

# Its own probes timed out on the runner ("context deadline exceeded") while
# the operator was busy with the first reconciliation; give it time to come
# up and check less often (chart values: initialDelaySeconds / periodSeconds).
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
