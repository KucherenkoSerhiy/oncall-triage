# Default values for nordwind-bank. See README.md for the values table.

# Tag applied to nordwind/<service> images (kind load doesn't need a
# registry; imagePullPolicy below is IfNotPresent so that works).
imageTag: latest

forwarder:
  # Azure alert-forwarder function URL (bank/azure/alert_forwarder), used
  # only by deploy/helm/values/kube-prometheus-stack.yaml's Alertmanager
  # receiver (this chart doesn't read it directly). Kept here so `helm
  # template --set forwarder.url=...` is one flag for the whole estate.
  url: ""

# Strimzi Kafka (KRaft): the cluster, topics, SCRAM users/ACLs
# (templates/kafka/), and the producer/consumer env + volumes on the three
# service Deployments below. `helm template --set kafka.enabled=false`
# renders the M6 estate with none of that (see README.md's Kafka section).
kafka:
  enabled: true

kafkaRelay:
  # Where kafka-relay POSTs route-A alerts (M7b). Same production ingest URL
  # bank/azure/alert_forwarder falls back to when its own INGEST_URL app
  # setting is unset - both routes end up at the one real ingest endpoint.
  # `INGEST_HMAC_SECRET` is not a value: it comes from the `nordwind-ingest`
  # Secret `task estate-up` creates from SSM (see
  # deploy/helm/nordwind-bank/templates/kafka/kafka-relay.yaml).
  ingestUrl: "https://api.triage.serhiykucherenko.dev/alerts"

monitoring:
  # kube-prometheus-stack's Helm release name. Stamped as the `release`
  # label on ServiceMonitor/PrometheusRule objects - see README.md for why
  # that's a belt-and-suspenders label alongside the open selectors set in
  # deploy/helm/values/kube-prometheus-stack.yaml.
  release: monitoring

services:
  # c4Container is the container's identifier in docs/c4/workspace.dsl
  # (nordwind.dev/c4-container's value) - see templates/_helpers.tpl.
  - name: cards-authorization
    c4Container: cards
  - name: fraud-scoring
    c4Container: fraud
  - name: open-banking-api
    c4Container: openBanking
