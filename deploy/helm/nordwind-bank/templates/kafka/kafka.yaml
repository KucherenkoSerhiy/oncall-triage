{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Release.Name }}
  annotations:
    # Required by the pinned Strimzi version (Taskfile.yml's STRIMZI_VERSION,
    # < 0.48.0) to run in KRaft mode with KafkaNodePool resources; ignored
    # (and unnecessary) from Strimzi 0.48.0 on.
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
  labels:
    app.kubernetes.io/part-of: nordwind-bank
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      superUsers:
        - admin
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    # A 4-vCPU GitHub runner shares its CPU between kind's control plane,
    # Prometheus, Strimzi and two Kafka JVMs: with Strimzi's default probes
    # (15 s initial delay, 3 failures) both nodes were killed mid-start-up
    # and crash-looped (#76). Generous probes and an explicit, modest heap
    # let a slow start finish; locally the same values are simply unused.
    jvmOptions:
      -Xms: 256m
      -Xmx: 384m
    livenessProbe:
      initialDelaySeconds: 120
      timeoutSeconds: 10
      periodSeconds: 20
      failureThreshold: 10
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
{{- end }}
