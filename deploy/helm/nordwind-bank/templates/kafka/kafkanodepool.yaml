{{- if .Values.kafka.enabled }}
# Two single-node pools, not one `dual-role` pool: the `broker-down` chaos
# action (scripts/chaos_k8s.py) scales a KafkaNodePool to 0 replicas, but
# Strimzi's cluster operator refuses to reconcile a Kafka cluster whose
# node pools sum to 0 replicas across the board - a combined
# controller+broker pool scaled to 0 takes the KRaft metadata quorum down
# with it and the operator just errors out instead of producing a broker
# outage. Splitting the controller out into its own pool that's never
# scaled means `broker` can go to 0 on its own and actually reproduce a
# broker-down outage.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    app.kubernetes.io/part-of: nordwind-bank
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: 1
  roles:
    - controller
  storage:
    type: ephemeral
  # A KRaft controller JVM does not start reliably under 256Mi (Strimzi sizes
  # the heap from the limit; the first estate-demo crash-looped both pods -
  # #75). Memory limits stay, CPU limits go: a CPU-throttled Kafka start-up
  # misses its readiness probe on a 4-vCPU runner.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    app.kubernetes.io/part-of: nordwind-bank
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: 1
  roles:
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
{{- end }}
