{{- if .Values.kafka.enabled }}
# Two single-node pools, not one `dual-role` pool: the `broker-down` chaos
# action (scripts/chaos_k8s.py) pauses reconciliation and deletes the broker
# StrimziPodSet (a broker pool cannot be scaled to 0 in KRaft mode - #78).
# With the controller in its own pool the KRaft metadata quorum survives the
# outage, so `clear` is a plain resume rather than a cluster rebuild.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    app.kubernetes.io/part-of: nordwind-bank
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: 1
  roles:
    - controller
  storage:
    type: ephemeral
  # A KRaft controller JVM does not start reliably under 256Mi (Strimzi sizes
  # the heap from the limit; the first estate-demo crash-looped both pods -
  # #75). Memory limits stay, CPU limits go: a CPU-throttled Kafka start-up
  # misses its readiness probe on a 4-vCPU runner.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    app.kubernetes.io/part-of: nordwind-bank
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: 1
  roles:
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
{{- end }}
