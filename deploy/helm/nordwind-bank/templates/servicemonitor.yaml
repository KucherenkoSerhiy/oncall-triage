{{- range .Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .name }}
  labels:
    {{- include "nordwind-bank.labels" . | nindent 4 }}
    release: {{ $.Values.monitoring.release }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
