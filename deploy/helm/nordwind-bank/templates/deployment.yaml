{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "nordwind-bank.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "nordwind-bank.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # Pod-level context so trivy KSV-0118 / PSS restricted hold even before
      # the container context applies; uid 10001 matches the image's USER.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .name }}
          image: "nordwind/{{ .name }}:{{ $.Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          {{- if $.Values.kafka.enabled }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: "{{ $.Release.Name }}-kafka-bootstrap.bank.svc:9093"
            - name: KAFKA_USER
              value: {{ .name }}
            - name: KAFKA_PASSWORD_FILE
              value: /etc/nordwind/kafka/user/password
            - name: KAFKA_CA_FILE
              value: /etc/nordwind/kafka/ca/ca.crt
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: faults
              mountPath: /etc/nordwind
              readOnly: true
            {{- if $.Values.kafka.enabled }}
            - name: kafka-user
              mountPath: /etc/nordwind/kafka/user
              readOnly: true
            - name: kafka-ca
              mountPath: /etc/nordwind/kafka/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: faults
          configMap:
            name: nordwind-faults
            items:
              - key: {{ .name }}
                path: fault
        {{- if $.Values.kafka.enabled }}
        - name: kafka-user
          secret:
            secretName: {{ .name }}
        - name: kafka-ca
          secret:
            secretName: {{ $.Release.Name }}-cluster-ca-cert
        {{- end }}
{{- end }}
