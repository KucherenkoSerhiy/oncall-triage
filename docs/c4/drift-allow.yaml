# Deliberate exceptions to the M8 C4 drift gate (scripts/c4_drift.py).
#
# Every entry is a container identifier from docs/c4/workspace.dsl that is
# tagged Deployable but is legitimately absent from the Terraform `tags`
# set, the Helm `nordwind.dev/c4-container` label set, or both - plus the
# reason, so the gate stays honest about what it does *not* catch (see ADR
# 0016). Anything else missing is a real drift and should fail CI.

- container: dashboard
  reason: >-
    aws_cloudwatch_dashboard has no `tags` argument in the AWS provider
    (infra/aws/observability.tf) - there is no resource that could carry a
    c4_container tag.

- container: appInsights
  reason: >-
    Application Insights, its Log Analytics workspace, the storage account
    and the service plan back both Azure Functions and don't map to one
    container the way a Lambda maps to its log group; infra/README.md
    documents that all four are tagged c4_container=monitor instead (see
    infra/azure/main.tf).

- container: kafkaExporter
  reason: >-
    kafka-exporter is generated by the Strimzi operator from the Kafka
    CR's spec.kafkaExporter stanza (deploy/helm/nordwind-bank/templates/kafka/kafka.yaml)
    - this chart renders the Kafka custom resource, not the Deployment
    Strimzi creates from it, so it cannot stamp a label on it.

- container: prometheus
  reason: >-
    Provisioned by the upstream kube-prometheus-stack Helm release
    (deploy/helm/values/kube-prometheus-stack.yaml), a separate chart and
    release from deploy/helm/nordwind-bank - out of this drift check's
    Helm scope by design (see docs/adr/0016-c4-drift-as-a-merge-gate.md).

- container: alertmanager
  reason: >-
    Same as prometheus: part of the kube-prometheus-stack release, not
    deploy/helm/nordwind-bank.
