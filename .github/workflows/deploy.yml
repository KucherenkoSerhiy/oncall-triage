name: deploy

# PR   -> terraform plan for every root, posted as a PR comment.
# main -> plan again, wait for the `demo` environment approval, apply.
# Auth is OIDC only: the AWS role and Azure federated identity come from
# infra/bootstrap (applied once by a human). Nothing here holds a key.

on:
  pull_request:
    # Everything that ends up inside a deployed artifact: Terraform roots, the
    # Lambda zips (archive_file over services/, bank/aws/, oncall_triage/), the
    # worker image, and the probes the smoke job runs (#43).
    paths: [infra/aws/**, infra/aws-ecr/**, infra/azure/**, infra/modules/**, services/**, bank/aws/**, oncall_triage/**, scripts/smoke.py, scripts/chaos_probe.py, scripts/dns_check.py, .github/workflows/deploy.yml]
  push:
    branches: [master, main]
    # Everything that ends up inside a deployed artifact: Terraform roots, the
    # Lambda zips (archive_file over services/, bank/aws/, oncall_triage/), the
    # worker image, and the probes the smoke job runs (#43).
    paths: [infra/aws/**, infra/aws-ecr/**, infra/azure/**, infra/modules/**, services/**, bank/aws/**, oncall_triage/**, scripts/smoke.py, scripts/chaos_probe.py, scripts/dns_check.py, .github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      root:
        description: which root module to apply
        type: choice
        options: [all, aws, azure]
        default: all
      worker_image_sha:
        description: git SHA of the triage-worker image to deploy (rollback = a previous SHA)
        type: string
        required: false
      anthropic_api_key:
        description: set/rotate the Anthropic API key in SSM (leave blank to keep the current value)
        type: string
        required: false
      chaos_probe:
        description: after the smoke probe, drive one real alarm end to end (payments-pool = PoolExhausted -> known-issue verdict)
        type: choice
        options: [none, payments-pool, payments-errors, ledger-lag, auth-jwks, notifications-429]
        default: none

permissions:
  id-token: write
  contents: read
  pull-requests: write

# bash here means `bash -eo pipefail`, so `terraform plan | tee` fails the
# job when terraform fails (the default shell only sets -e).
defaults:
  run:
    shell: bash

# Per-ref concurrency so a run parked at the demo approval never blocks PR
# plans; runs on different refs share the Terraform state, so plan and apply
# wait for the state lock (-lock-timeout) instead of failing on contention.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: eu-north-1
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Cloudflare provider (infra/aws, NS delegation of triage.*): API token
  # scoped to Zone:Read + DNS:Edit on the parent zone only.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # Until infra/bootstrap has been applied and its outputs stored as
  # repository variables there is nothing to authenticate with; skip
  # honestly instead of failing on a missing role.
  preflight:
    name: preflight - bootstrap variables present?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy skipped - run infra/bootstrap and set AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET, AZURE_* repository variables (see infra/README.md)"
          fi

  # Applies infra/aws-ecr (just the container registry) so the repository
  # exists before `image` tries to push to it, and before `plan`/`apply`
  # look it up with `data "aws_ecr_repository"` - see infra/README.md for
  # why this is a separate root instead of infra/aws creating and using the
  # repository in the same apply. Runs directly (no plan-comment/approval
  # step) because it never touches anything but the registry itself; PRs
  # never reach it.
  ecr:
    name: ecr - apply infra/aws-ecr
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      repository_url: ${{ steps.output.outputs.repository_url }}
      repository_name: ${{ steps.output.outputs.repository_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform apply
        run: |
          terraform -chdir=infra/aws-ecr init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform -chdir=infra/aws-ecr apply -auto-approve -lock-timeout=5m
      - id: output
        run: |
          echo "repository_url=$(terraform -chdir=infra/aws-ecr output -raw worker_repository_url)" >> "$GITHUB_OUTPUT"
          echo "repository_name=$(terraform -chdir=infra/aws-ecr output -raw worker_repository_name)" >> "$GITHUB_OUTPUT"

  # Builds and pushes the triage-worker image so `:sha-<git sha>` exists by
  # the time `plan`/`apply` reference it. Skipped on pull requests: a PR
  # plans against `var.worker_image_sha`'s default (`latest`) instead, which
  # is realistic without needing push access from a PR context.
  image:
    name: image - build and push triage-worker
    needs: [preflight, ecr]
    if: needs.preflight.outputs.ready == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      worker_image_sha: ${{ steps.tag.outputs.worker_image_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "worker_image_sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Skip when this commit's image already exists
        # The repository is tag-immutable, so a second push of sha-<sha> would
        # fail. A re-run on the same commit (rollback, retry, the one-time
        # bootstrap dispatch) reuses the image instead of rebuilding it.
        id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ needs.ecr.outputs.repository_name }}"                --image-ids imageTag="${{ steps.tag.outputs.worker_image_sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::image ${{ steps.tag.outputs.worker_image_sha }} already in ECR - build skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete the previous :latest tag
        if: steps.exists.outputs.exists != 'true'
        # The repository is IMMUTABLE (sha-<sha> tags must never be
        # overwritten), which also blocks re-pushing the rolling `:latest`
        # alias once it exists. Deleting it first (ignoring "not found" on
        # the very first push) keeps `:latest` mutable in effect while sha
        # tags stay genuinely immutable.
        run: |
          aws ecr batch-delete-image \
            --repository-name "${{ needs.ecr.outputs.repository_name }}" \
            --image-ids imageTag=latest || true
      - name: Build and push
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/triage_worker/Dockerfile
          platforms: linux/arm64
          push: true
          # Lambda only accepts a single-platform Docker v2 / OCI image
          # manifest. buildx's default provenance attestation wraps the push
          # in an OCI image index, which CreateFunction rejects with "image
          # manifest, config or layer media type ... is not supported".
          provenance: false
          sbom: false
          tags: |
            ${{ needs.ecr.outputs.repository_url }}:${{ steps.tag.outputs.worker_image_sha }}
            ${{ needs.ecr.outputs.repository_url }}:latest

  # Manual-only: rotate or set the Anthropic key from the Actions UI so the
  # owner never needs a local AWS credential. The parameter itself is never
  # created by Terraform (docs/specs/m3b - it's a human secret); this is the
  # one-time/rotation path, infra/README.md documents the equivalent local
  # `aws ssm put-parameter` command.
  anthropic_key:
    name: anthropic key - sync the repository secret (or a dispatch input) into SSM
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KEY_INPUT: ${{ inputs.anthropic_api_key }}
      KEY_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Put the key in SSM (dispatch input wins; otherwise the ANTHROPIC_API_KEY secret)
        # The owner keeps the key in the repository secret store; every
        # non-PR deploy re-syncs it into the SSM parameter the worker reads,
        # so rotation is `gh secret set` plus any deploy. The value is masked
        # before it can reach a log line and never leaves the runner.
        run: |
          KEY="${KEY_INPUT:-$KEY_SECRET}"
          if [ -z "$KEY" ]; then
            echo "::notice::no Anthropic key available (dispatch input empty and ANTHROPIC_API_KEY secret unset) - SSM parameter left untouched"
            exit 0
          fi
          echo "::add-mask::$KEY"
          aws ssm put-parameter --name "/nordwind-triage/demo/anthropic-api-key" --type SecureString --value "$KEY" --overwrite >/dev/null
          echo "synced /nordwind-triage/demo/anthropic-api-key"

  plan:
    name: plan - ${{ matrix.root }}
    needs: [preflight, ecr, image, anthropic_key]
    if: |
      always() &&
      needs.preflight.outputs.ready == 'true' &&
      (needs.ecr.result == 'success' || needs.ecr.result == 'skipped') &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.anthropic_key.result == 'success' || needs.anthropic_key.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [aws, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - name: AWS credentials (OIDC) - also the state backend for both roots
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Azure login (OIDC)
        if: matrix.root == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform init
        run: >
          terraform -chdir=infra/${{ matrix.root }} init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: Determine the worker_image_sha var
        id: worker_var
        run: |
          if [ "${{ matrix.root }}" != "aws" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.worker_image_sha }}" ]; then
            echo "flag=-var=worker_image_sha=${{ inputs.worker_image_sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.image.outputs.worker_image_sha }}" ]; then
            echo "flag=-var=worker_image_sha=${{ needs.image.outputs.worker_image_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: terraform plan
        run: |
          EXTRA_VARS=""
          if [ "${{ matrix.root }}" = "azure" ]; then
            # infra/azure never talks to AWS itself (M1), so its two Function
            # app secrets ride in as -var flags read here with the AWS role -
            # same SSM parameters and command as the smoke job.
            terraform -chdir=infra/aws init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="region=${{ env.AWS_REGION }}" >/dev/null
            CONSOLE_TOKEN=$(aws ssm get-parameter --with-decryption \
              --name "$(terraform -chdir=infra/aws output -raw console_token_parameter)" \
              --query Parameter.Value --output text)
            INGEST_HMAC_SECRET=$(aws ssm get-parameter --with-decryption \
              --name "$(terraform -chdir=infra/aws output -raw hmac_secret_parameter)" \
              --query Parameter.Value --output text)
            echo "::add-mask::$CONSOLE_TOKEN"
            echo "::add-mask::$INGEST_HMAC_SECRET"
            EXTRA_VARS="-var=console_token=$CONSOLE_TOKEN -var=ingest_hmac_secret=$INGEST_HMAC_SECRET"
          fi
          terraform -chdir=infra/${{ matrix.root }} plan -no-color -out=tfplan -lock-timeout=5m \
            -var="notification_email=${{ secrets.BUDGET_EMAIL }}" \
            ${{ steps.worker_var.outputs.flag }} \
            $EXTRA_VARS \
            | tee plan.txt
      - name: Post plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(-60000);
            const marker = '<!-- tfplan:${{ matrix.root }} -->';
            const body = marker + '\n### terraform plan - `infra/${{ matrix.root }}`\n\n<details><summary>show plan</summary>\n\n```\n' + plan + '\n```\n</details>';
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    name: apply - ${{ matrix.root }}
    needs: [plan, image]
    if: github.event_name != 'pull_request' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: demo
    strategy:
      max-parallel: 1
      matrix:
        root: [aws, azure]
    steps:
      - name: Decide whether this root is selected
        id: sel
        run: |
          want="${{ inputs.root }}"
          if [ -z "$want" ] || [ "$want" = "all" ] || [ "$want" = "${{ matrix.root }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.sel.outputs.run == 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.sel.outputs.run == 'true'
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.sel.outputs.run == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/login@v3
        if: steps.sel.outputs.run == 'true' && matrix.root == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Determine the worker_image_sha var
        id: worker_var
        if: steps.sel.outputs.run == 'true'
        run: |
          if [ "${{ matrix.root }}" != "aws" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.worker_image_sha }}" ]; then
            echo "flag=-var=worker_image_sha=${{ inputs.worker_image_sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.image.outputs.worker_image_sha }}" ]; then
            echo "flag=-var=worker_image_sha=${{ needs.image.outputs.worker_image_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: terraform apply
        if: steps.sel.outputs.run == 'true'
        run: |
          terraform -chdir=infra/${{ matrix.root }} init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          EXTRA_VARS=""
          if [ "${{ matrix.root }}" = "azure" ]; then
            # Same SSM read as the plan job - infra/azure never talks to AWS
            # itself, so its two Function app secrets ride in as -var flags.
            terraform -chdir=infra/aws init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="region=${{ env.AWS_REGION }}" >/dev/null
            CONSOLE_TOKEN=$(aws ssm get-parameter --with-decryption \
              --name "$(terraform -chdir=infra/aws output -raw console_token_parameter)" \
              --query Parameter.Value --output text)
            INGEST_HMAC_SECRET=$(aws ssm get-parameter --with-decryption \
              --name "$(terraform -chdir=infra/aws output -raw hmac_secret_parameter)" \
              --query Parameter.Value --output text)
            echo "::add-mask::$CONSOLE_TOKEN"
            echo "::add-mask::$INGEST_HMAC_SECRET"
            EXTRA_VARS="-var=console_token=$CONSOLE_TOKEN -var=ingest_hmac_secret=$INGEST_HMAC_SECRET"
          fi
          terraform -chdir=infra/${{ matrix.root }} apply -auto-approve -lock-timeout=5m \
            -var="notification_email=${{ secrets.BUDGET_EMAIL }}" \
            ${{ steps.worker_var.outputs.flag }} \
            $EXTRA_VARS
      - name: Verify the Function apps indexed their functions
        # A zip deploy can "succeed" and still leave an app with no functions
        # (missing requirements, skipped remote build - #59/#64). Fail the apply
        # leg here rather than discovering it in a chaos probe an hour later.
        if: steps.sel.outputs.run == 'true' && matrix.root == 'azure'
        run: |
          set -u
          RG=rg-nordwind-triage-demo
          for app in nordwind-triage-demo-notifications nordwind-triage-demo-forwarder; do
            ok=""
            for i in $(seq 1 20); do
              fns=$(az functionapp function list -n "$app" -g "$RG" --query "[].name" -o tsv 2>/dev/null | paste -sd' ' -)
              if [ -n "$fns" ]; then ok=1; echo "$app: $fns"; break; fi
              sleep 15
            done
            [ -n "$ok" ] || { echo "::error::$app exposes no functions 5 min after deploy - check AppTraces for 'Worker failed to index functions'"; exit 1; }
          done

  smoke:
    name: smoke probe
    needs: apply
    if: github.event_name != 'pull_request' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init (read-only - outputs only)
        run: >
          terraform -chdir=infra/aws init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: Probe the deployed system
        run: |
          SMOKE_HMAC_SECRET=$(aws ssm get-parameter --with-decryption \
            --name "$(terraform -chdir=infra/aws output -raw hmac_secret_parameter)" \
            --query Parameter.Value --output text)
          SMOKE_TOKEN=$(aws ssm get-parameter --with-decryption \
            --name "$(terraform -chdir=infra/aws output -raw console_token_parameter)" \
            --query Parameter.Value --output text)
          export SMOKE_HMAC_SECRET SMOKE_TOKEN
          python scripts/smoke.py
          echo "SMOKE_TOKEN=$SMOKE_TOKEN" >> "$GITHUB_ENV"
      - name: DNS check - DNSSEC (ad flag, RRSIG, DS/DNSKEY) and hostname resolution
        # Non-fatal: DNSSEC validation depends on resolver caches around the
        # world catching up to the DS record, which can take up to a week
        # after it is first published (infra/README.md "DNSSEC") - a failure
        # here in that window is not proof of a broken deploy. Safe to make
        # this step fatal (drop continue-on-error) once that window passes.
        continue-on-error: true
        run: python scripts/dns_check.py
      - name: Chaos probe - one real alarm end to end
        # Manual-only (workflow_dispatch input): sets a fault through the
        # console API, waits for the estate's own alarm to reach the spine
        # and for a real-model verdict, then clears the fault. ~3-5 min on
        # AWS. Mapping: <service>-<mode> -> the alarm signal it must produce.
        if: github.event_name == 'workflow_dispatch' && inputs.chaos_probe != 'none' && inputs.chaos_probe != ''
        run: |
          case "${{ inputs.chaos_probe }}" in
            payments-pool)     set -- --service payments --mode pool --expect-alert PoolExhausted --expect-known ;;
            payments-errors)   set -- --service payments --mode errors --expect-alert Errors ;;
            ledger-lag)        set -- --service ledger --mode lag --expect-alert ApproximateAgeOfOldestMessage ;;
            auth-jwks)         set -- --service auth --mode jwks-rotation --expect-alert AuthFailures ;;
            # Azure Monitor evaluates on a slower cadence than CloudWatch;
            # 12 min covers the metric alert's up-to-a-minute delay plus the
            # scheduled query rule's own PT1M/PT5M evaluation window.
            notifications-429) set -- --service customer-notifications --mode provider-429 --expect-alert Provider429 --timeout 720 ;;
          esac
          python scripts/chaos_probe.py "$@"
