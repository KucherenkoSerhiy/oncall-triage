name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python - ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  terraform:
    name: terraform - fmt, validate, tflint (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [infra/bootstrap/aws, infra/bootstrap/azure, infra/bootstrap/github, infra/aws-ecr, infra/aws, infra/azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.root }} validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.53.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir=${{ matrix.root }} --config=${{ github.workspace }}/.tflint.hcl

  checkov:
    name: checkov - infra policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          output_format: cli
          soft_fail: false

  helm:
    name: helm - lint, kubeconform, trivy config, Taskfile validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v3
        with:
          version: "3.53.1"
      - name: Taskfile.yml is valid (catches YAML/templating errors in the estate-* tasks)
        run: task --list
      - uses: azure/setup-helm@v4
        with:
          version: "v3.17.1"
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: helm template | kubeconform -strict (default values)
        run: |
          helm template deploy/helm/nordwind-bank | kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: helm template | kubeconform -strict (forwarder.url set)
        run: |
          helm template deploy/helm/nordwind-bank --set forwarder.url=https://example/x | kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: helm template | kubeconform -strict (kafka.enabled=false)
        run: |
          helm template deploy/helm/nordwind-bank --set kafka.enabled=false | kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Trivy config scan of the rendered manifests (kafka.enabled=true and false)
        run: |
          mkdir -p /tmp/rendered-true /tmp/rendered-false
          helm template deploy/helm/nordwind-bank --set forwarder.url=https://example/x > /tmp/rendered-true/nordwind-bank.yaml
          helm template deploy/helm/nordwind-bank --set forwarder.url=https://example/x --set kafka.enabled=false > /tmp/rendered-false/nordwind-bank.yaml
          trivy config --exit-code 1 --severity HIGH,CRITICAL /tmp/rendered-true
          trivy config --exit-code 1 --severity HIGH,CRITICAL /tmp/rendered-false

  contract:
    name: contract - Redpanda-backed Kafka contract tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/contract -m contract

  c4:
    name: c4 - model validates, generated diagrams are current, no drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: azure/setup-helm@v4
        with:
          version: "v3.17.1"
      - name: Export Structurizr model to Mermaid
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/docs/c4:/usr/local/structurizr" structurizr/structurizr \
            export -workspace /usr/local/structurizr/workspace.dsl -format mermaid -output /usr/local/structurizr/generated
          python scripts/c4_render.py
      - name: Generated diagrams must match the committed ones
        run: |
          git status --porcelain -- docs/c4/generated
          git diff --exit-code -- docs/c4/generated \
            || { echo "::error::docs/c4/generated is stale - run 'task c4' and commit"; exit 1; }
      - name: C4 drift - workspace.dsl vs. Terraform tags and Helm labels
        run: |
          set -o pipefail
          python scripts/c4_drift.py --strict | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ADR index must match the ADR files
        run: |
          python scripts/adr_index.py
          git diff --exit-code -- docs/adr/README.md \
            || { echo "::error::docs/adr/README.md is stale - run 'task adr-index' and commit"; exit 1; }
