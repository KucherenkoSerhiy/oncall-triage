name: estate-demo

# The live gate for M6: creates a real kind cluster, installs
# kube-prometheus-stack + the nordwind-bank chart, runs the cards-timeouts
# chaos scenario end to end (fault -> Prometheus rule -> Alertmanager ->
# route B -> ingest -> verdict), uploads diagnostics, and tears the cluster
# down. Manual (workflow_dispatch) and a weekly Sunday 06:00 UTC schedule -
# never on every PR (see docs/specs/m6b, non-requirements).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  group: estate-demo
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  KIND_VERSION: v0.25.0
  HELM_VERSION: v3.17.1
  KUBECONFORM_VERSION: v0.6.7
  TASK_VERSION: 3.53.1
  AWS_REGION: eu-north-1

jobs:
  estate-demo:
    name: estate-demo - kind cluster, cards-timeouts chaos scenario
    runs-on: ubuntu-latest
    # 25 min for the M6 steps + headroom for M7a's extra estate-up work
    # (installing the Strimzi operator and waiting up to 10 min for the
    # Kafka resource's Ready condition).
    timeout-minutes: 30
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install task
        uses: arduino/setup-task@v3
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install kind (checksum-verified)
        run: |
          curl -sSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -sSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cat kind.sha256sum)  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform (checksum-verified)
        run: |
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSLo CHECKSUMS "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS"
          grep "kubeconform-linux-amd64.tar.gz$" CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"

      # forwarder.url documented at deploy/helm/values/kube-prometheus-stack.yaml
      # and infra/README.md: the FORWARDER_URL environment secret below is set
      # by hand from `terraform output -raw forwarder_url` of infra/azure (a
      # sensitive output - see docs/specs/m5b) once the Azure estate is live.
      # Empty is fine: route B then targets the dummy receiver (task
      # estate-status reports it).
      - name: Create the kind cluster, install monitoring + nordwind-bank
        env:
          FORWARDER_URL: ${{ secrets.FORWARDER_URL }}
        run: task estate-up

      - name: AWS credentials (OIDC) - read SMOKE_TOKEN from SSM, same as deploy.yml's smoke job
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init (read-only - outputs only)
        run: >
          terraform -chdir=infra/aws init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Run the cards-timeouts chaos scenario
        run: |
          SMOKE_TOKEN=$(aws ssm get-parameter --with-decryption \
            --name "$(terraform -chdir=infra/aws output -raw console_token_parameter)" \
            --query Parameter.Value --output text)
          echo "::add-mask::$SMOKE_TOKEN"
          export SMOKE_TOKEN
          task estate-demo

      - name: Dump Alertmanager alerts
        if: always()
        continue-on-error: true
        run: curl -s http://localhost:9093/api/v2/alerts > alertmanager-alerts.json

      - name: Dump Prometheus rules state
        if: always()
        continue-on-error: true
        run: curl -s http://localhost:9090/api/v1/rules > prometheus-rules.json

      - name: Dump bank service logs
        if: always()
        continue-on-error: true
        run: |
          for svc in cards-authorization fraud-scoring open-banking-api; do
            kubectl -n bank logs "deploy/$svc" --all-containers --tail=1000 > "$svc.log" || true
          done

      - name: Dump cluster events
        if: always()
        continue-on-error: true
        run: kubectl get events -A --sort-by=.lastTimestamp | tail -100 > events.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estate-demo-${{ github.run_id }}
          path: |
            alertmanager-alerts.json
            prometheus-rules.json
            *.log
            events.txt
          if-no-files-found: ignore

      - name: Delete the kind cluster
        if: always()
        run: task estate-down
