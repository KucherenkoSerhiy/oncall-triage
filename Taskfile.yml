# Task runner - https://taskfile.dev. Every command a contributor needs,
# named the same way the CI jobs are.
version: "3"

vars:
  TF_ROOTS: infra/bootstrap/aws infra/bootstrap/azure infra/aws-ecr infra/aws infra/azure
  C4_DIR: docs/c4
  # kubeconform's CRD schema-location pattern for ServiceMonitor/PrometheusRule
  # and (M7a) Kafka/KafkaNodePool/KafkaTopic/KafkaUser - pinned to a commit
  # (not `main`) so a schema landing upstream can't break CI unannounced.
  # Not a Task template var - kubeconform expands it itself at runtime, so
  # the braces are escaped to survive Task's own templating.
  KUBECONFORM_CRDS_CATALOG_COMMIT: ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2
  KUBECONFORM_CRD_SCHEMA: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/{{.KUBECONFORM_CRDS_CATALOG_COMMIT}}/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json'
  # Pinned tool/chart versions for the kind estate (M6b). Kept in sync with
  # deploy/kind/cluster.yaml (node image), deploy/helm/values/kube-prometheus-stack.yaml
  # (chart version) and .github/workflows/{ci,estate-demo}.yml (kubeconform, trivy).
  KIND_NODE_IMAGE: 'kindest/node:v1.31.2@sha256:18fbefc20a7113353c7b75b5c869d7145a6abd6269154825872dc59c1329912e'
  KUBE_PROMETHEUS_STACK_VERSION: 65.5.1
  KUBECONFORM_VERSION: v0.6.7
  TRIVY_VERSION: v0.74.0
  # Strimzi Kafka operator chart (M7a): `helm repo add strimzi https://strimzi.io/charts/`.
  # Pinned to the last version requiring the `strimzi.io/kraft` /
  # `strimzi.io/node-pools` annotations used in deploy/helm/nordwind-bank/templates/kafka/kafka.yaml
  # (from 0.48.0 on they're ignored no-ops); Kafka version 3.9.0 is pinned
  # to match (deploy/helm/nordwind-bank/templates/kafka/kafka.yaml).
  STRIMZI_VERSION: 0.45.0
  # Under the repo (not /tmp - Task's mvdan/sh shell resolves a leading
  # `/` relative to the current directory on Windows, not an OS temp
  # root), so this stays portable on the laptop and on ubuntu-latest.
  RENDERED_ALERTMANAGER_VALUES: '{{.ROOT_DIR}}/.tmp/nordwind-kube-prometheus-stack.yaml'

tasks:
  default:
    cmds: [task --list]

  install:
    desc: Install Python dev dependencies and pre-commit hooks
    cmds:
      - pip install -r requirements-dev.txt
      - pre-commit install

  lint:
    desc: Ruff lint + format check, mypy
    cmds:
      - ruff check .
      - ruff format --check .
      - mypy

  fmt:
    desc: Auto-format Python and Terraform
    cmds:
      - ruff check --fix .
      - ruff format .
      - terraform fmt -recursive infra

  test:
    desc: Lint + unit tests (what ci.yml runs for Python)
    deps: [lint]
    cmds:
      - pytest

  tf:validate:
    desc: terraform fmt -check, init (no backend) and validate every root module
    cmds:
      - terraform fmt -check -recursive infra
      - for: { var: TF_ROOTS }
        cmd: terraform -chdir={{.ITEM}} init -backend=false -input=false >/dev/null && terraform -chdir={{.ITEM}} validate

  tf:lint:
    desc: tflint every root module
    cmds:
      - tflint --init
      - for: { var: TF_ROOTS }
        cmd: tflint --chdir={{.ITEM}}

  tf:scan:
    desc: checkov over infra/ (policy in .checkov.yaml)
    cmds:
      - checkov --config-file .checkov.yaml

  c4:
    desc: Export the Structurizr model to docs/c4/generated (Mermaid)
    cmds:
      - docker run --rm -v "{{.PWD}}/{{.C4_DIR}}:/usr/local/structurizr" structurizr/structurizr export -workspace /usr/local/structurizr/workspace.dsl -format mermaid -output /usr/local/structurizr/generated
      - python scripts/c4_render.py
    vars:
      PWD:
        sh: pwd

  c4:check:
    desc: Fail if docs/c4/generated is stale relative to workspace.dsl (what ci.yml enforces)
    deps: [c4]
    cmds:
      - git diff --exit-code -- {{.C4_DIR}}/generated

  c4-drift:
    desc: Compare workspace.dsl against Terraform c4_container tags and Helm nordwind.dev/c4-container labels (what ci.yml's c4 job enforces with --strict)
    cmds:
      - python scripts/c4_drift.py --strict

  docs-check:
    desc: Fail on a relative Markdown link that doesn't resolve, or a generated C4 view no document mentions (what ci.yml's python job runs)
    cmds:
      - python scripts/check_links.py

  adr-index:
    desc: Regenerate docs/adr/README.md's index table from every ADR's heading
    cmds:
      - python scripts/adr_index.py

  adr-index:check:
    desc: Fail if docs/adr/README.md is stale relative to the ADR files (what ci.yml's c4 job enforces)
    deps: [adr-index]
    cmds:
      - git diff --exit-code -- docs/adr/README.md

  helm-lint:
    desc: helm lint the nordwind-bank chart (what ci.yml's helm job runs first)
    cmds:
      - helm lint deploy/helm/nordwind-bank

  helm-check:
    desc: helm template the nordwind-bank chart (default values, a forwarder URL, and kafka.enabled=false) through kubeconform -strict
    cmds:
      - helm template deploy/helm/nordwind-bank | kubeconform -strict -summary -kubernetes-version 1.31.0
        -schema-location default
        -schema-location '{{.KUBECONFORM_CRD_SCHEMA}}'
      - helm template deploy/helm/nordwind-bank --set forwarder.url=https://example/x | kubeconform -strict -summary -kubernetes-version 1.31.0
        -schema-location default
        -schema-location '{{.KUBECONFORM_CRD_SCHEMA}}'
      - helm template deploy/helm/nordwind-bank --set kafka.enabled=false | kubeconform -strict -summary -kubernetes-version 1.31.0
        -schema-location default
        -schema-location '{{.KUBECONFORM_CRD_SCHEMA}}'

  estate-up:
    desc: Create the kind cluster if missing, install monitoring + Strimzi + nordwind-bank, load the service images
    cmds:
      - docker pull {{.KIND_NODE_IMAGE}}
      - |
        if ! kind get clusters | grep -qx nordwind; then
          kind create cluster --name nordwind --config deploy/kind/cluster.yaml
        fi
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo add strimzi https://strimzi.io/charts/
      - helm repo update prometheus-community strimzi
      - mkdir -p {{.ROOT_DIR}}/.tmp
      - python scripts/render_alertmanager_values.py deploy/helm/values/kube-prometheus-stack.yaml
        --forwarder-url "$FORWARDER_URL" --cluster-label "${DEMO_RUN_ID:-kind-local}" > {{.RENDERED_ALERTMANAGER_VALUES}}
      - helm upgrade --install monitoring prometheus-community/kube-prometheus-stack
        --version {{.KUBE_PROMETHEUS_STACK_VERSION}} -n monitoring --create-namespace
        -f {{.RENDERED_ALERTMANAGER_VALUES}} --wait
      - |
        # strimzi-kafka-operator's watchNamespaces: [bank] value makes the chart
        # create RoleBindings in `bank` at install time - that namespace has to
        # exist before this install, not just before `nordwind-bank` later.
        kubectl create namespace bank --dry-run=client -o yaml | kubectl apply -f -
      - helm upgrade --install strimzi-kafka-operator strimzi/strimzi-kafka-operator
        --version {{.STRIMZI_VERSION}} -n kafka --create-namespace
        -f deploy/helm/values/strimzi.yaml --wait
      - kubectl -n kafka wait --for=condition=Available deployment/strimzi-cluster-operator --timeout=180s
      - docker build -f bank/k8s/cards_authorization/Dockerfile -t nordwind/cards-authorization:dev .
      - docker build -f bank/k8s/fraud_scoring/Dockerfile -t nordwind/fraud-scoring:dev .
      - docker build -f bank/k8s/open_banking_api/Dockerfile -t nordwind/open-banking-api:dev .
      - docker build -f bank/k8s/alerts_bridge/Dockerfile -t nordwind/alerts-bridge:dev .
      - docker build -f bank/k8s/kafka_relay/Dockerfile -t nordwind/kafka-relay:dev .
      - kind load docker-image nordwind/cards-authorization:dev nordwind/fraud-scoring:dev
        nordwind/open-banking-api:dev nordwind/alerts-bridge:dev nordwind/kafka-relay:dev --name nordwind
      - |
        # M7b: the nordwind-ingest Secret kafka-relay's Deployment references
        # by name (deploy/helm/nordwind-bank/templates/kafka/kafka-relay.yaml)
        # - never in the chart itself. Documented in
        # docs/runbooks/kubernetes-estate.md; needs AWS credentials for the
        # SSM read (already configured by the time estate-demo.yml gets here -
        # see that workflow for the OIDC step order).
        INGEST_HMAC_SECRET=$(aws ssm get-parameter --with-decryption \
          --name /nordwind-triage/demo/ingest-hmac-secret --query Parameter.Value --output text)
        kubectl -n bank create secret generic nordwind-ingest \
          --from-literal=hmac-secret="$INGEST_HMAC_SECRET" \
          --dry-run=client -o yaml | kubectl apply -f -
      # No --wait here: the service pods mount KafkaUser Secrets that only
      # exist once Strimzi has brought the cluster up, so a chart-level wait
      # would time out on ContainerCreating pods (#75). Wait for Kafka first,
      # then for each Deployment's rollout.
      - helm upgrade --install nordwind-bank deploy/helm/nordwind-bank -n bank --create-namespace
        --set imageTag=dev
      - |
        if ! kubectl -n bank wait --for=condition=Ready kafka/nordwind-bank --timeout=600s; then
          echo "Kafka not Ready after 600s"; kubectl -n bank get pods
          for p in $(kubectl -n bank get pods -o name | grep -E "broker|controller"); do
            echo "--- $p"; kubectl -n bank describe "$p" | tail -20; kubectl -n bank logs "$p" --tail=80 || true
          done
          echo "--- strimzi-cluster-operator"; kubectl -n kafka logs deploy/strimzi-cluster-operator --tail=120
          exit 1
        fi
      - |
        for d in $(kubectl -n bank get deploy -o name); do
          kubectl -n bank rollout status "$d" --timeout=300s || { kubectl -n bank get pods; kubectl -n bank describe "$d" | tail -30; exit 1; }
        done
      - 'echo "Prometheus:   http://localhost:9090"'
      - 'echo "Alertmanager: http://localhost:9093"'
      - kubectl get pods -A

  estate-down:
    desc: Delete the kind cluster
    cmds:
      - kind delete cluster --name nordwind

  estate-status:
    desc: Show bank/monitoring pods, the nordwind-faults ConfigMap, firing Alertmanager alerts, and (--kafka) topics + consumer lag
    cmds:
      - python scripts/estate_status.py {{.CLI_ARGS}}

  dns-check:
    desc: Verify DNSSEC (ad flag, RRSIG, DS/DNSKEY match) and hostname resolution for the delegated zone
    cmds:
      - python scripts/dns_check.py

  chaos-k8s:
    desc: 'Patch a Kubernetes bank service''s fault mode (task chaos-k8s -- cards-authorization timeouts|clear) or the kafka broker (task chaos-k8s -- kafka broker-down|clear)'
    cmds:
      - python scripts/chaos_k8s.py {{.CLI_ARGS}}

  estate-demo:
    desc: Run the cards-timeouts, fraud-lag, and broker-down chaos scenarios against the local kind cluster
    cmds:
      - python scripts/estate_scenarios.py --scenario cards-timeouts
      - python scripts/estate_scenarios.py --scenario fraud-lag
      - python scripts/estate_scenarios.py --scenario broker-down

  agent:
    desc: Run the ADK dev UI for the triage agent (phase-1 experience)
    cmds:
      - adk web

  worker:build:
    desc: Build the triage worker's Lambda container image locally (not pushed anywhere)
    cmds:
      - docker build -f services/triage_worker/Dockerfile -t nordwind-triage-worker:local .

  worker:local:
    desc: Run the built image under the Lambda Runtime Interface Emulator and invoke it with the sample SQS event
    deps: [worker:build]
    cmds:
      - docker run --rm -d --name nordwind-triage-worker-local -p 9000:8080
        -e ALERTS_TABLE -e VERDICTS_TABLE -e KNOWN_ISSUES_TABLE -e ANTHROPIC_API_KEY -e TRIAGE_MODEL -e DAILY_ALERT_CAP
        nordwind-triage-worker:local
      - sleep 2
      - 'curl -XPOST "http://localhost:9000/2015-03-31/functions/function/invocations" -d @tests/triage_worker/fixtures/sqs_event.json'
      - docker stop nordwind-triage-worker-local
