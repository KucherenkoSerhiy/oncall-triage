# Task runner - https://taskfile.dev. Every command a contributor needs,
# named the same way the CI jobs are.
version: "3"

vars:
  TF_ROOTS: infra/bootstrap/aws infra/bootstrap/azure infra/aws-ecr infra/aws infra/azure
  C4_DIR: docs/c4
  # kubeconform's CRD schema-location pattern for ServiceMonitor/PrometheusRule
  # (not a Task template var - kubeconform expands it itself at runtime, so
  # the braces are escaped to survive Task's own templating).
  KUBECONFORM_CRD_SCHEMA: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json'

tasks:
  default:
    cmds: [task --list]

  install:
    desc: Install Python dev dependencies and pre-commit hooks
    cmds:
      - pip install -r requirements-dev.txt
      - pre-commit install

  lint:
    desc: Ruff lint + format check, mypy
    cmds:
      - ruff check .
      - ruff format --check .
      - mypy

  fmt:
    desc: Auto-format Python and Terraform
    cmds:
      - ruff check --fix .
      - ruff format .
      - terraform fmt -recursive infra

  test:
    desc: Lint + unit tests (what ci.yml runs for Python)
    deps: [lint]
    cmds:
      - pytest

  tf:validate:
    desc: terraform fmt -check, init (no backend) and validate every root module
    cmds:
      - terraform fmt -check -recursive infra
      - for: { var: TF_ROOTS }
        cmd: terraform -chdir={{.ITEM}} init -backend=false -input=false >/dev/null && terraform -chdir={{.ITEM}} validate

  tf:lint:
    desc: tflint every root module
    cmds:
      - tflint --init
      - for: { var: TF_ROOTS }
        cmd: tflint --chdir={{.ITEM}}

  tf:scan:
    desc: checkov over infra/ (policy in .checkov.yaml)
    cmds:
      - checkov --config-file .checkov.yaml

  c4:
    desc: Export the Structurizr model to docs/c4/generated (Mermaid)
    cmds:
      - docker run --rm -v "{{.PWD}}/{{.C4_DIR}}:/usr/local/structurizr" structurizr/structurizr export -workspace /usr/local/structurizr/workspace.dsl -format mermaid -output /usr/local/structurizr/generated
      - python scripts/c4_render.py
    vars:
      PWD:
        sh: pwd

  c4:check:
    desc: Fail if docs/c4/generated is stale relative to workspace.dsl (what ci.yml enforces)
    deps: [c4]
    cmds:
      - git diff --exit-code -- {{.C4_DIR}}/generated

  helm-lint:
    desc: helm lint the nordwind-bank chart (what ci.yml's helm job runs first)
    cmds:
      - helm lint deploy/helm/nordwind-bank

  helm-check:
    desc: helm template the nordwind-bank chart (default values and with a forwarder URL) through kubeconform -strict
    cmds:
      - helm template deploy/helm/nordwind-bank | kubeconform -strict -summary -kubernetes-version 1.31.0
        -schema-location default
        -schema-location '{{.KUBECONFORM_CRD_SCHEMA}}'
      - helm template deploy/helm/nordwind-bank --set forwarder.url=https://example/x | kubeconform -strict -summary -kubernetes-version 1.31.0
        -schema-location default
        -schema-location '{{.KUBECONFORM_CRD_SCHEMA}}'

  agent:
    desc: Run the ADK dev UI for the triage agent (phase-1 experience)
    cmds:
      - adk web

  worker:build:
    desc: Build the triage worker's Lambda container image locally (not pushed anywhere)
    cmds:
      - docker build -f services/triage_worker/Dockerfile -t nordwind-triage-worker:local .

  worker:local:
    desc: Run the built image under the Lambda Runtime Interface Emulator and invoke it with the sample SQS event
    deps: [worker:build]
    cmds:
      - docker run --rm -d --name nordwind-triage-worker-local -p 9000:8080
        -e ALERTS_TABLE -e VERDICTS_TABLE -e KNOWN_ISSUES_TABLE -e ANTHROPIC_API_KEY -e TRIAGE_MODEL -e DAILY_ALERT_CAP
        nordwind-triage-worker:local
      - sleep 2
      - 'curl -XPOST "http://localhost:9000/2015-03-31/functions/function/invocations" -d @tests/triage_worker/fixtures/sqs_event.json'
      - docker stop nordwind-triage-worker-local
